# Verificações de segurança do repositório.
#   - Varredura de segredos (gitleaks)
#   - CodeQL com detecção automática de linguagem (só roda se houver código)
#   - Revisão de dependências em PRs (falha em severidade high ou critical)
#   - Auditoria de dependências (npm, pip, go) e scan de Dockerfile/imagem (Trivy), condicionais
#
# Todos os jobs que dependem de stack são condicionais: em repositório vazio o workflow passa.
# Referências: ABNT NBR ISO/IEC 27001 e 27002 (segurança da informação); LGPD (Lei 13.709/2018).
name: Security

on:
  workflow_dispatch:
  push:
    branches: [main, Test]
  pull_request:
    branches: [main, Test]
  schedule:
    # Semanal: segunda-feira, 06:00 UTC. Agendamentos rodam sempre na branch padrão (main).
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detectar stack do repositório
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_code: ${{ steps.detect.outputs.has_code }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_docker: ${{ steps.detect.outputs.has_docker }}
    steps:
      - uses: actions/checkout@v7

      - id: detect
        name: Detectar arquivos da stack
        shell: bash
        run: |
          set -uo pipefail
          # Somente arquivos rastreados pelo git, fora de dependências e builds.
          tracked="$(git ls-files)"
          code_files="$(printf '%s\n' "$tracked" | grep -vE '(^|/)(node_modules|vendor|dist|build)/' || true)"
          flag() { if "$@"; then echo true; else echo false; fi; }
          has_code() { printf '%s\n' "$code_files" | grep -qE '\.(js|jsx|ts|tsx|mjs|cjs|py|go|java|kt|rb|php|cs|rs|swift|c|cc|cpp|h|hpp)$'; }
          has_root_file() { printf '%s\n' "$tracked" | grep -qxF "$1"; }
          has_python() { printf '%s\n' "$tracked" | grep -qxE 'requirements\.txt|pyproject\.toml'; }
          {
            echo "has_code=$(flag has_code)"
            echo "has_node=$(flag has_root_file package.json)"
            echo "has_python=$(flag has_python)"
            echo "has_go=$(flag has_root_file go.mod)"
            echo "has_docker=$(flag has_root_file Dockerfile)"
          } >> "$GITHUB_OUTPUT"

  secrets-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Necessário para o gitleaks analisar o histórico de commits, não só o último commit.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Opcional. Repositórios de conta pessoal rodam sem licença. Em organizações, o
          # gitleaks-action exige GITLEAKS_LICENSE (licença comercial): avaliar antes de migrar.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql:
    name: CodeQL (análise estática)
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Upload dos resultados para a aba Security.
      security-events: write
      # Necessário em repositórios privados.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        # Sem `languages`: o CodeQL detecta automaticamente as linguagens presentes.

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Revisão de dependências (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          # Falha se o PR introduzir vulnerabilidade de severidade high ou critical.
          fail-on-severity: high

  audit-node:
    name: Auditoria npm
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Gerar lockfile se ausente (somente para auditoria, não é commitado)
        run: |
          if [ ! -f package-lock.json ] && [ ! -f npm-shrinkwrap.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

      - name: npm audit (falha em severidade high ou superior)
        run: npm audit --audit-level=high

  audit-python:
    name: Auditoria pip
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: pip-audit (requirements.txt ou pyproject.toml)
        # pip-audit não tem limiar de severidade: qualquer vulnerabilidade conhecida falha o job.
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            pip-audit .
          fi

  audit-go:
    name: Auditoria Go (govulncheck)
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Instalar govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: govulncheck
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          govulncheck ./...

  container-scan:
    name: Trivy (Dockerfile e imagem)
    needs: detect
    if: needs.detect.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Trivy - misconfiguração do Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build da imagem para scan
        shell: bash
        run: docker build -t ci-scan:local -f Dockerfile .

      - name: Trivy - vulnerabilidades da imagem (high e critical com correção disponível)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ci-scan:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
